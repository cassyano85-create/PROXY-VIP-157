
name: Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PROXY_VIP_157_projeto_android.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          mkdir project
          unzip PROXY_VIP_157_projeto_android.zip -d project

      - name: Compilar APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PROXY-VIP-157-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
